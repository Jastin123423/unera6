    <!-- =========================================
         STYLES
    ========================================== -->

    <style>

        html,
        body {
            background-color: #18191A;
            color: #E4E6EB;

            font-family:
                'Segoe UI',
                Helvetica,
                Arial,
                sans-serif;

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            overflow-y: scroll;

            -webkit-tap-highlight-color:
                transparent;

            overscroll-behavior-y: contain;
        }

        body {
            padding-top:
                env(safe-area-inset-top);

            padding-bottom:
                env(safe-area-inset-bottom);
        }

        #root {
            min-height: 100vh;
        }

        /* =========================================
           HIDE SCROLLBARS GLOBALLY
        ========================================== */

        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
            box-sizing: border-box;
        }

        /* =========================================
           TOUCH EXPERIENCE
        ========================================== */

        button,
        a,
        input,
        textarea,
        select {
            touch-action: manipulation;
        }

        img,
        video {
            user-select: none;
            -webkit-user-drag: none;
        }

        /* =========================================
           LIKE HEART
        ========================================== */

        @keyframes pop-heart {

            0% {
                transform:
                    scale(0)
                    rotate(-45deg);

                opacity: 0;
            }

            50% {
                transform:
                    scale(1.5)
                    rotate(-45deg);

                opacity: 1;
            }

            100% {
                transform:
                    scale(1)
                    rotate(-45deg);

                opacity: 0;
            }
        }

        .animate-pop-heart {
            animation:
                pop-heart
                0.8s
                ease-out
                forwards;
        }

        /* =========================================
           FADE IN
        ========================================== */

        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .animate-fade-in {
            animation:
                fadeIn
                0.2s
                ease-out;
        }

        /* =========================================
           SLIDE UP
        ========================================== */

        @keyframes slideUp {

            from {
                transform:
                    translateY(100%);
            }

            to {
                transform:
                    translateY(0);
            }
        }

        .animate-slide-up {
            animation:
                slideUp
                0.3s
                cubic-bezier(
                    0.1,
                    0.7,
                    0.1,
                    1
                )
                forwards;
        }

        /* =========================================
           SLIDE HALF
        ========================================== */

        @keyframes slideUpHalf {

            from {
                transform:
                    translateY(50%);

                opacity: 0;
            }

            to {
                transform:
                    translateY(0);

                opacity: 1;
            }
        }

        .animate-slide-up-half {
            animation:
                slideUpHalf
                0.3s
                cubic-bezier(
                    0.1,
                    0.7,
                    0.1,
                    1
                )
                forwards;
        }

        /* =========================================
           SLIDE DOWN
        ========================================== */

        @keyframes slideDown {

            from {
                transform:
                    translateY(-100%);

                opacity: 0;
            }

            to {
                transform:
                    translateY(0);

                opacity: 1;
            }
        }

        .animate-slide-down {
            animation:
                slideDown
                0.3s
                cubic-bezier(
                    0.1,
                    0.7,
                    0.1,
                    1
                )
                forwards;
        }

        /* =========================================
           SPLASH LOADER
        ========================================== */

        @keyframes unera-loader {

            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        .animate-unera-loader {
            animation:
                unera-loader
                3s
                linear
                forwards;
        }

        /* =========================================
           DARK AUTOFILL FIX
        ========================================== */

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {

            -webkit-box-shadow:
                0 0 0 30px #3A3B3C inset !important;

            -webkit-text-fill-color:
                #E4E6EB !important;
        }

        /* =========================================
           WAVEFORM
        ========================================== */

        .waveform-track {
            position: relative;

            height: 60px;

            width: 100%;

            display: flex;

            align-items: center;

            overflow: hidden;

            border-radius: 8px;
        }

        .waveform-bar {
            background-color: #4A4A4A;

            width: 3px;

            margin-right: 2px;

            border-radius: 2px;
        }

        .trim-window {
            position: absolute;

            height: 100%;

            background-color:
                rgba(254, 44, 85, 0.3);

            border-left:
                3px solid #FE2C55;

            border-right:
                3px solid #FE2C55;

            cursor: grab;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .trim-window:active {
            cursor: grabbing;
        }

        .trim-handle {
            width: 10px;

            height: 24px;

            background-color: #FFF;

            border-radius: 3px;
        }

    </style>
