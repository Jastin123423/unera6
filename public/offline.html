<!-- public/offline.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Unera</title>
  <style>
    body {
      background: #18191A;
      color: #E4E6EB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .offline-container {
      padding: 2rem;
    }
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      color: #1877F2;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    p {
      color: #B0B3B8;
      margin-bottom: 2rem;
    }
    button {
      background: #1877F2;
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #166FE5;
    }
    .cached-content {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #3E4042;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You're offline</h1>
    <p>Don't worry! Your previously viewed posts are still available.</p>
    <button onclick="window.location.reload()">Try Again</button>
    
    <div class="cached-content">
      <p>✨ You can still view cached posts and images</p>
    </div>
  </div>
</body>
</html>
